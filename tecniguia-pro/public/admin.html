<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · TecniGuía</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef1f3;--panel:#fff;--ink:#15212b;--muted:#5a6873;--line:#d5dce1;--accent:#0b6e8a;--accent-ink:#fff;--accent-soft:#dcedf2;--green:#2e7d4f;--green-soft:#dff1e6;--amber:#b86e00;--amber-soft:#fbefd9;--red:#b3261e;--red-soft:#f9e1df;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#10171c;--panel:#18222a;--ink:#e3eaee;--muted:#93a3ad;--line:#2b3943;--accent:#4cb3d0;--accent-ink:#06222b;--accent-soft:#16323c;--green:#6cc790;--green-soft:#16301f;--amber:#f0a73a;--amber-soft:#33270f;--red:#f2857b;--red-soft:#3a1c1a;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
main{max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-size:30px;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.ok{background:var(--green-soft);color:var(--green)} .warn{background:var(--amber-soft);color:var(--amber)} .bad{background:var(--red-soft);color:var(--red)}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent)} .btn.red{border-color:var(--red);color:var(--red);background:transparent}
input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 220px}
.muted{color:var(--muted)} .msg{font-size:14px}
.tmp{font-family:var(--f-mono);background:var(--amber-soft);padding:2px 6px;border-radius:4px;user-select:all}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <h1>Panel <span>TecniGuía</span></h1>
    <a href="./">Volver a la app</a>
  </div>
  <p class="msg" id="msg">Cargando…</p>
  <div class="tiles" id="tiles" hidden></div>
  <div class="row" id="tools" hidden>
    <input type="search" id="q" placeholder="Buscar por nombre, correo o WhatsApp" autocomplete="off">
    <span class="muted">Costos estimados con los precios de config.php (últimos 30 días).</span>
  </div>
  <div class="panel" id="tabla" hidden></div>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let DATA = null, tmp = {};
  async function api(path, body) {
    const r = await fetch("api/" + path, { method: body ? "POST" : "GET", credentials: "same-origin", headers: { "X-TG": "1", ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => null);
    if (!r.ok) { const e = new Error(j?.mensaje || "Error " + r.status); e.status = r.status; throw e; }
    return j;
  }
  const fecha = s => s ? new Date(s.replace(" ", "T")).toLocaleDateString("es-CO") : "–";
  function estado(u) {
    if (u.admin) return '<span class="pill ok">Admin</span>';
    if (u.estado === "suspendido") return '<span class="pill bad">Suspendido</span>';
    if (!u.plan_ok) return '<span class="pill bad">Vencido</span>';
    return u.estado === "prueba" ? '<span class="pill warn">Prueba</span>' : '<span class="pill ok">Activo</span>';
  }
  function render() {
    const q = $("#q").value.toLowerCase().trim();
    const us = DATA.usuarios.filter(u => !q || [u.nombre, u.email, u.telefono].join(" ").toLowerCase().includes(q));
    const all = DATA.usuarios;
    const act = all.filter(u => !u.admin && u.estado === "activo" && u.plan_ok).length;
    const prueba = all.filter(u => !u.admin && u.estado === "prueba" && u.plan_ok).length;
    const costo = all.reduce((a, u) => a + u.costo_30d_usd, 0);
    const llam = all.reduce((a, u) => a + u.llamadas_30d, 0);
    $("#tiles").innerHTML = `
      <div class="tile"><b>${all.length}</b><span>técnicos registrados</span></div>
      <div class="tile"><b>${act}</b><span>con plan activo</span></div>
      <div class="tile"><b>${prueba}</b><span>en prueba gratis</span></div>
      <div class="tile"><b>US$ ${costo.toFixed(2)}</b><span>costo de IA, 30 días (${llam} consultas)</span></div>
      <div class="tile"><b>US$ ${(costo / Math.max(1, all.filter(u => u.llamadas_30d > 0).length)).toFixed(2)}</b><span>costo promedio por técnico que usó la IA</span></div>`;
    $("#tabla").innerHTML = `<table><thead><tr><th>Técnico</th><th>WhatsApp</th><th>Estado</th><th>Vence</th><th>Visitas</th><th>Consultas 30 d</th><th>Costo 30 d</th><th>Último acceso</th><th>Acciones</th></tr></thead><tbody>
      ${us.map(u => `<tr>
        <td><b>${esc(u.nombre)}</b><br><span class="muted">${esc(u.email)}</span></td>
        <td>${esc(u.telefono || "–")}</td>
        <td>${estado(u)}</td>
        <td class="num">${fecha(u.vence)}</td>
        <td class="num">${u.visitas}</td>
        <td class="num">${u.llamadas_30d}</td>
        <td class="num">US$ ${u.costo_30d_usd.toFixed(2)}</td>
        <td class="num">${fecha(u.ultimo_acceso)}</td>
        <td>${u.admin ? "" : `<div class="row">
          <select data-dias="${u.id}" aria-label="Días a activar"><option value="30">30 días</option><option value="90">90 días</option><option value="180">6 meses</option><option value="365">1 año</option></select>
          <button class="btn" data-act="activar" data-id="${u.id}">Activar</button>
          <button class="btn red" data-act="suspender" data-id="${u.id}">Suspender</button>
          <button class="btn ghost" data-act="clave" data-id="${u.id}">Clave temporal</button>
          ${tmp[u.id] ? `<span>Nueva clave: <span class="tmp">${esc(tmp[u.id])}</span></span>` : ""}</div>`}</td>
      </tr>`).join("") || '<tr><td colspan="9" class="muted">Sin resultados.</td></tr>'}
    </tbody></table>`;
  }
  async function load() {
    try {
      DATA = await api("admin.php");
      $("#msg").textContent = "Activa a un técnico cuando te pague. Los días se suman a los que le queden.";
      ["#tiles", "#tools", "#tabla"].forEach(s => $(s).hidden = false);
      render();
    } catch (e) {
      $("#msg").innerHTML = e.status === 401 ? 'Primero <a href="./">entra a la app</a> con tu correo de administrador.' : esc(e.message);
    }
  }
  $("#q").addEventListener("input", () => DATA && render());
  $("#tabla").addEventListener("click", async e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = +b.dataset.id, act = b.dataset.act;
    if (act === "suspender" && b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro?"; return; }
    b.disabled = true;
    try {
      const r = await api("admin.php", { accion: act, id, dias: +($(`select[data-dias="${id}"]`)?.value || 30) });
      if (act === "clave") tmp[id] = r.clave;
      await load();
    } catch (x) { $("#msg").textContent = x.message; b.disabled = false; }
  });
  load();
})();
</script>
</body>
</html>
